services:
  - type: web
    name: mailbrief
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: ENV
        value: production
      - key: APP_NAME
        value: MailBrief
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: FREE_PLAN_MONTHLY_LIMIT
        value: "100"
      - key: DATABASE_URL
        fromDatabase:
          name: mailbrief-db
          property: connectionString

databases:
  - name: mailbrief-db
    plan: free
